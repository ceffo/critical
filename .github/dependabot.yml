version: 2
updates:
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]
        # bob (v0) minor bumps change the generated DAL: it gets its own PR,
        # never grouped, never auto-merged (docs/backend.md, "Dependency bumps").
        exclude-patterns:
          - github.com/stephenafamo/bob*

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # The production image (root Dockerfile). Its golang tag must match api/go.mod (the image build
  # fails on a mismatch), and api/go.mod is the source of truth: the tag and go.mod are bumped
  # together by hand, so golang is ignored here.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: golang
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
