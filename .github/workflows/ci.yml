name: CI

on:
  # labeled/unlabeled: adding or removing ci-skip re-runs CI with the new decision.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # Also how main gets its run after a merge GitHub made with a workflow's GITHUB_TOKEN (the Dependabot
  # auto-merge): such a merge starts no push run. Release follows a dispatched run on main like a push one.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the slow jobs (dev-smoke, e2e, image) run: skipped for a documentation-only change or a
  # pull request labelled ci-skip (scripts/ci-skip-slow.sh). validate and generated never wait for it, and a
  # skipped job counts as a success, so the CI run stays green and the Release workflow still starts.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      skip_slow: ${{ steps.decide.outputs.skip_slow }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether the slow jobs run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: scripts/ci-skip-slow.sh

  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v4
      - run: npm ci
        working-directory: web
      - run: just validate

  dev-smoke:
    name: dev-smoke
    needs: changes
    if: needs.changes.outputs.skip_slow != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v4
      - run: npm ci
        working-directory: web
      - run: just dev-smoke

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.skip_slow != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v4
      - run: npm ci
        working-directory: web
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: web
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: web
      - run: just e2e
      - name: Upload e2e results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: web/e2e-results/
          retention-days: 7
          if-no-files-found: ignore

  # Builds the production image with the fixture catalogue and smoke-checks it (ADR 0024 steps 1
  # and 7.1). Nothing is pushed and no build cache is exported.
  image:
    name: image
    needs: changes
    if: needs.changes.outputs.skip_slow != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the image (fixture catalogue)
        run: >-
          docker build -t critical:ci
          --build-context catalogue=api/testdata
          --build-context changelog=api/testdata
          --build-arg COMMIT="$GITHUB_SHA" --build-arg VERSION=0.0.0 .
      # 0.0.0: a stand-in version, to check that the one baked in is the one /api/health reports.
      - name: Smoke-check the image
        run: scripts/image-smoke.sh critical:ci "$GITHUB_SHA" 0.0.0

  generated:
    name: generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: extractions/setup-just@v4
      - name: Regenerate the DAL (sqlc) and mockery mocks
        run: |
          just generate
          just mocks
      - name: Fail if generated files changed
        run: git diff --exit-code && test -z "$(git status --porcelain)"
