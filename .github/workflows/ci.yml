name: CI

on:
  # labeled/unlabeled: adding or removing ci-skip re-runs CI with the new decision.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # Also how main gets its run after a merge GitHub made with a workflow's GITHUB_TOKEN (the Dependabot
  # auto-merge): such a merge starts no push run, so main-catchup.yml dispatches one. A dispatched run does
  # not start Release (workflow_run); the catch-up dispatches Release for the commit once this run is green.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the slow jobs run (scripts/ci-skip-slow.sh, ADR 0048). dev-smoke and image are skipped for a
  # documentation-only change or a pull request labelled ci-skip; e2e also when the pull request touches no UI or
  # API path, and when a push only updated the branch (the PR's own diff is unchanged). validate and generated
  # never wait for it, and a skipped job counts as a success, so the CI run stays green and the Release workflow
  # still starts.
  changes:
    name: changes
    runs-on: ubuntu-latest
    # checks: read lets the script see whether e2e passed on the previous head before a pure branch update keeps it.
    permissions:
      contents: read
      checks: read
    outputs:
      skip_slow: ${{ steps.decide.outputs.skip_slow }}
      skip_e2e: ${{ steps.decide.outputs.skip_e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether the slow jobs run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: scripts/ci-skip-slow.sh

  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/setup-just
      - run: npm ci
        working-directory: web
      - run: just validate

  dev-smoke:
    name: dev-smoke
    needs: changes
    if: needs.changes.outputs.skip_slow != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/setup-just
      - run: npm ci
        working-directory: web
      - run: just dev-smoke

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.skip_e2e != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/setup-just
      - run: npm ci
        working-directory: web
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: web
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: web
      # The apt packages (fonts, xvfb, libnss3...) come from the runner's Ubuntu mirror, which sometimes
      # throttles to ~40 kB/s. Two defences, so the job does not depend on a fast mirror:
      # 1. The downloaded .debs are cached under a key WITHOUT the runner image version (images roll
      #    often and each one used to start cold). The key is bucketed by ISO week so the debs are
      #    refreshed as the mirror moves on; restore-keys falls back to the previous bucket, which still
      #    covers most packages.
      # 2. A cold or stale cache downloads with bounded, retried attempts. Debs fetched by a timed-out
      #    attempt stay in /var/cache/apt/archives, so each retry resumes where the last stopped. The cache
      #    is saved only after a successful install and holds only the debs that install used, so a hit is
      #    always installable offline (a stale hit that is not falls back to the archive).
      - name: Pick the apt cache bucket
        id: apt-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore apt packages for Chromium
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-debs
          key: apt-chromium-v2-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ steps.apt-week.outputs.week }}
          restore-keys: |
            apt-chromium-v2-${{ runner.os }}-${{ steps.pw.outputs.version }}-
            apt-chromium-v2-${{ runner.os }}-
      - name: Install Chromium system dependencies
        timeout-minutes: 8
        run: |
          mkdir -p "$HOME/apt-debs"
          # Debs already in the archive dir (the runner image's, not ours) are never saved: only what this
          # step restores or downloads is, so the cache is exactly what Chromium's packages need.
          touch "$RUNNER_TEMP/apt-start"
          sleep 1
          sudo cp -n "$HOME"/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          # Fail a stalled connection fast and let apt retry it.
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-network >/dev/null
          # With cached debs the packages are installed from them first, by name and without any download, so
          # an Ubuntu archive or DNS outage does not fail a job that has its packages; without them, or if
          # that fails, bounded attempts use the archive. A timed-out attempt has its leftover apt-get
          # stopped before the next starts, so it does not hold the apt lock
          # (scripts/ci-install-chromium-deps.sh).
          ok=0
          scripts_dir="$(git rev-parse --show-toplevel)/scripts"
          offline=""
          if ls "$HOME"/apt-debs/*.deb >/dev/null 2>&1; then offline=1; fi
          OFFLINE="$offline" "$scripts_dir/ci-install-chromium-deps.sh" && ok=1
          # Save only on success (a set the install could not use is not worth keeping), and only the debs
          # this run restored or downloaded.
          if [ "$ok" = 1 ]; then
            sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -newer "$RUNNER_TEMP/apt-start" \
              -exec cp -n -t "$HOME/apt-debs/" {} +
            sudo chown -R "$USER" "$HOME/apt-debs"
          fi
          [ "$ok" = 1 ]
        working-directory: web
      - name: Save apt packages for Chromium
        if: ${{ success() && steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/apt-debs
          key: apt-chromium-v2-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ steps.apt-week.outputs.week }}
      - name: Run the e2e suite
        # The suite's budget is 3 minutes (ADR 0048, docs/agent-workflow.md); 6 here makes a regression fail on this
        # step instead of the job timeout hiding which step was slow: the tripwire for a regression.
        timeout-minutes: 6
        run: just e2e
      - name: Upload e2e results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: web/e2e-results/
          retention-days: 7
          if-no-files-found: ignore

  # Builds the production image with the fixture catalogue and smoke-checks it (ADR 0024 steps 1
  # and 7.1). Nothing is pushed and no build cache is exported.
  image:
    name: image
    needs: changes
    if: needs.changes.outputs.skip_slow != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the image (fixture catalogue)
        run: >-
          docker build -t critical:ci
          --build-context catalogue=api/testdata
          --build-context changelog=api/testdata
          --build-arg COMMIT="$GITHUB_SHA" --build-arg VERSION=0.0.0 .
      # 0.0.0: a stand-in version, to check that the one baked in is the one /api/health reports.
      - name: Smoke-check the image
        run: scripts/image-smoke.sh critical:ci "$GITHUB_SHA" 0.0.0

  generated:
    name: generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: ./.github/actions/setup-just
      - name: Regenerate the DAL (sqlc) and mockery mocks
        run: |
          just generate
          just mocks
      - name: Fail if generated files changed
        run: git diff --exit-code && test -z "$(git status --porcelain)"
