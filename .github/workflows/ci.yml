name: CI

on:
  # labeled/unlabeled: adding or removing ci-skip re-runs CI with the new decision.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # Also how main gets its run after a merge GitHub made with a workflow's GITHUB_TOKEN (the Dependabot
  # auto-merge): such a merge starts no push run, so main-catchup.yml dispatches one. A dispatched run does
  # not start Release (workflow_run); the catch-up dispatches Release for the commit once this run is green.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the slow jobs run (scripts/ci-skip-slow.sh, ADR 0048). dev-smoke and image are skipped for a
  # documentation-only change or a pull request labelled ci-skip; e2e also when the pull request touches no UI or
  # API path, and when a push only updated the branch (the PR's own diff is unchanged). validate and generated
  # never wait for it, and a skipped job counts as a success, so the CI run stays green and the Release workflow
  # still starts.
  changes:
    name: changes
    # Never a fork's pull request (docs/ci-runner.md): the jobs that need changes are skipped with it.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # checks: read lets the script see whether e2e passed on the previous head before a pure branch update keeps it.
    permissions:
      contents: read
      checks: read
    outputs:
      skip_slow: ${{ steps.decide.outputs.skip_slow }}
      skip_e2e: ${{ steps.decide.outputs.skip_e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether the slow jobs run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: scripts/ci-skip-slow.sh

  # `just validate` is check-scripts, check-api and check-web in a row (about 6.5 min); CI runs the three groups as
  # parallel jobs (each on its own runner) and the `validate` job below, the required check, passes when all three do.
  validate-scripts:
    name: validate-scripts
    # Never a fork's pull request (docs/ci-runner.md): the jobs that need changes are skipped with it.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/setup-just
      - run: just check-scripts

  validate-api:
    name: validate-api
    # Never a fork's pull request (docs/ci-runner.md): the jobs that need changes are skipped with it.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: ./.github/actions/setup-just
      - run: just check-api

  validate-web:
    name: validate-web
    # Never a fork's pull request (docs/ci-runner.md): the jobs that need changes are skipped with it.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/setup-just
      - run: npm ci
        working-directory: web
      - run: just check-web

  validate:
    name: validate
    needs: [validate-scripts, validate-api, validate-web]
    # always(): a failed group must fail this job, not skip it (a skipped required check passes). A fork's pull
    # request skips the groups and this job with them.
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "validate groups: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  dev-smoke:
    name: dev-smoke
    needs: changes
    if: needs.changes.outputs.skip_slow != 'true'
    runs-on: [self-hosted, critical]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Cancelled runs leak docker networks; a full address-pool table fails every later job.
      - run: scripts/ci-docker-sweep.sh
      # cache: false on the self-hosted runner: setup-go's restore untars ~/go/pkg/mod over the runner's own
      # persistent module cache (shared by its jobs) and floods 'File exists' errors that failed the post step.
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/setup-just
      - run: npm ci
        working-directory: web
      - run: just dev-smoke

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.skip_e2e != 'true'
    runs-on: [self-hosted, critical]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # cache: false on the self-hosted runner: setup-go's restore untars ~/go/pkg/mod over the runner's own
      # persistent module cache (shared by its jobs) and floods 'File exists' errors that failed the post step.
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/setup-just
      - run: npm ci
        working-directory: web
      # Chromium's system packages (fonts, xvfb, libnss3...) are installed once on the runner (docs/ci-runner.md),
      # so no apt step runs here; the browser build is downloaded only when Playwright's version moved on.
      # flock: runner instances on the same VM share ~/.cache/ms-playwright; one download at a time.
      - name: Install Playwright Chromium
        run: mkdir -p "$HOME/.cache" && flock "$HOME/.cache/ms-playwright.lock" npx playwright install chromium
        working-directory: web
      - name: Run the e2e suite
        # The suite's budget is 3 minutes (ADR 0048, docs/agent-workflow.md); 6 here makes a regression fail on this
        # step instead of the job timeout hiding which step was slow: the tripwire for a regression.
        timeout-minutes: 6
        run: just e2e
      # Only a failure needs the screens and traces; nothing reads them after a green run.
      - name: Upload e2e results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: web/e2e-results/
          retention-days: 7
          if-no-files-found: ignore

  # Builds the production image with the fixture catalogue and smoke-checks it (ADR 0024 steps 1
  # and 7.1). Nothing is pushed and no build cache is exported. The tag carries the run id and attempt: runner
  # instances on the same VM share one Docker daemon, so two image jobs must not share a tag.
  image:
    name: image
    needs: changes
    if: needs.changes.outputs.skip_slow != 'true'
    runs-on: [self-hosted, critical]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Sweep stale smoke containers and networks
        run: scripts/ci-docker-sweep.sh
      - name: Build the image (fixture catalogue)
        run: >-
          docker build -t "critical:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --build-context catalogue=api/testdata
          --build-context changelog=api/testdata
          --build-arg COMMIT="$GITHUB_SHA" --build-arg VERSION=0.0.0 .
      # 0.0.0: a stand-in version, to check that the one baked in is the one /api/health reports.
      - name: Smoke-check the image
        run: scripts/image-smoke.sh "critical:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" 0.0.0
      - name: Remove the image
        if: ${{ always() }}
        run: docker rmi -f "critical:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" || true

  generated:
    name: generated code is up to date
    # Never a fork's pull request (docs/ci-runner.md): the jobs that need changes are skipped with it.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: ./.github/actions/setup-just
      - name: Regenerate the DAL (sqlc) and mockery mocks
        run: |
          just generate
          just mocks
      - name: Fail if generated files changed
        run: git diff --exit-code && test -z "$(git status --porcelain)"
