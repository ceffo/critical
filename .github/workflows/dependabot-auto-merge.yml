name: Dependabot auto-merge

# Routine Dependabot updates merge themselves: on a Dependabot PR whose updates are all semver patch or
# minor, this enables GitHub auto-merge (squash). GitHub then merges once the required status checks of
# main pass (scripts/github-branch-protection.sh); red CI never merges. Anything else is left open for the
# supervisor (.claude/agents/supervisor.md, "PR watch"): a major update gets the label `major-update`, and a
# sqlc bump is never auto-merged because it changes the generated DAL (docs/backend.md, "Dependency bumps").
#
# pull_request_target, not pull_request: a Dependabot-triggered pull_request run gets a read-only token.
# It is safe here because nothing from the PR is checked out or run; the job only reads Dependabot's
# metadata and calls the GitHub API.
#
# The merge GitHub performs is attributed to this workflow's GITHUB_TOKEN, and events caused by GITHUB_TOKEN
# start no workflow run (except workflow_dispatch): the push to main would get no CI run, hence no Release
# run. So the job stays alive until the PR is merged, then dispatches CI on main itself (ci.yml accepts
# workflow_dispatch; release.yml accepts a CI run it dispatched). No extra secret needed.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# A new push to the PR restarts the job, which would otherwise wait for a merge that is no longer coming.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write   # dispatch CI on main once the PR is merged

jobs:
  auto-merge:
    name: enable auto-merge or label
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Read the Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Classify the update
        id: kind
        env:
          UPDATES: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          if jq -e 'any(.[]; .updateType == "version-update:semver-major")' <<<"$UPDATES" >/dev/null; then
            echo "kind=major" >> "$GITHUB_OUTPUT"
          elif jq -e 'any(.[]; .dependencyName | test("sqlc"))' <<<"$UPDATES" >/dev/null; then
            echo "kind=sqlc" >> "$GITHUB_OUTPUT"
          else
            echo "kind=routine" >> "$GITHUB_OUTPUT"
          fi
      - name: Label a major update and leave it open
        if: ${{ steps.kind.outputs.kind == 'major' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create major-update --color d93f0b --description "Dependabot major update: needs a human or the supervisor" 2>/dev/null || true
          gh pr edit "$PR" --add-label major-update
      - name: Enable auto-merge (squash)
        if: ${{ steps.kind.outputs.kind == 'routine' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --auto --squash
      # Polls until GitHub merges the PR (CI plus the required checks take a few minutes), then starts
      # main's CI run, which the merge itself did not. Gives up when the PR is closed unmerged or after an
      # hour: the supervisor's PR watch then handles it.
      - name: Start CI on main once merged
        if: ${{ steps.kind.outputs.kind == 'routine' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for _ in $(seq 1 120); do
            state="$(gh pr view "$PR" --json state --jq .state)"
            case "$state" in
              MERGED)
                gh workflow run ci.yml --ref main
                echo "PR #$PR merged: dispatched CI on main"
                exit 0 ;;
              CLOSED)
                echo "PR #$PR closed without merging: nothing to start"
                exit 0 ;;
            esac
            sleep 30
          done
          echo "::warning::PR #$PR not merged after an hour: no CI run started on main"
