name: Deploy staging

# Manual redeploy of an image already pushed to the private staging app (ADR 0024 steps 3.2-3.3): Actions >
# Deploy staging > Run workflow, with the full sha. The automatic deploy is a job of release.yml; both use
# the composite action .github/actions/staging-deploy. Runbook: docs/deploy.md ("Staging deploy").
#
# A manual run with no FLY_API_TOKEN fails like the automatic one: someone asked for a deploy that cannot
# happen, which is not the "not provisioned yet" case that keeps main green (that only concerns the
# release build, step 10.4).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit sha of an image already pushed to registry.fly.io/critical-staging
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: deploy staging
    # Main only: a run started from another branch would run that branch's copy of this file with the
    # staging token. (The environment's own deployment-branch rule is the enforced half, docs/deploy.md.)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment scopes FLY_API_TOKEN: no other job of the workflow can read it.
    environment: staging
    permissions:
      contents: read
      deployments: write
    # Serialized, never cancelled once started: a newer commit replaces only the one queued.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/staging-deploy
        with:
          sha: ${{ inputs.sha }}
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
          public-access-option: ${{ vars.PUBLIC_ACCESS_OPTION }}
          github-token: ${{ github.token }}
