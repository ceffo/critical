name: Promote
run-name: Promote ${{ inputs.version || 'the newest staging version' }}

# The promotion of ADR 0024 step 4, on demand: run by hand from main (Actions > Promote > Run workflow, or
# `just promote [version]`). With no version it promotes the newest vMAJOR.MINOR.PATCH version that passed
# staging; with one (X.Y.Z or vX.Y.Z) that version, which is also the rollback. It deploys that version's
# image (by digest, the one staging ran, no rebuild) to production after a restore point of the production
# database (a pg_dump, encrypted, kept as an artifact of the run: no artifact, no deploy), then smoke-checks it
# and creates the GitHub Release. Runbook: docs/deploy.md ("Promotion").
#
# Only by hand: no tag push starts it. It runs main's workflow, scripts and fly config; the image and the
# migrations it embeds are the version's. Only a repository admin may run it (scripts/require-admin.sh,
# before any secret); the environment `production` accepts deployments from the branch main only.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote (X.Y.Z or vX.Y.Z; empty: the newest that passed staging; an older one rolls back)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  # A dispatch from another branch or a tag is a mistake (the version is the input, the run is main's): it
  # fails and says so, instead of a green run that did nothing. No environment, no secret.
  not-main:
    name: refuse a run from another ref than main
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Use main
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error title=Promotion::$REF is not main: nothing was promoted. Run the workflow from main (Use workflow from: main) with the version as its input, docs/deploy.md (Promotion)."
          exit 1

  # Who and what, before the production environment and its secret: the admin check, then the version.
  resolve:
    name: resolve the version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read # the staging deployment records
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # every tag, and main's history (the on-main guard)
          persist-credentials: false

      - name: Check the actor is an admin
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: scripts/require-admin.sh "$ACTOR" "$TRIGGERING_ACTOR"

      # The version asked must exist, be on main and have passed staging; none asked: the newest that did.
      - name: Resolve the version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          out="$(scripts/release-guards.sh resolve "$VERSION")"
          echo "$out"
          tag="$(sed -n 's/^tag=//p' <<<"$out")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "### Promoting $tag"
            echo
            echo "$out" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: promote to production
    needs: resolve
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment scopes FLY_API_TOKEN (the production app's deploy token): no other job can read it.
    environment: production
    permissions:
      contents: write # the GitHub Release
      deployments: write # the staging deployment record (read), the production one (written after the smoke check)
    # Production deployments never run concurrently and are never cancelled midway (step 4).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the guards check that the tag's commit is on origin/main
          persist-credentials: false

      # Again here, before the secret: "Re-run failed jobs" re-runs this job alone, by whoever clicks it.
      - name: Check the actor is an admin
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: scripts/require-admin.sh "$ACTOR" "$TRIGGERING_ACTOR"

      # A promotion is a deliberate act: a secret this job cannot read fails it (step 10.4).
      - name: Check the deploy secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RESTORE_POINT_PASSPHRASE: ${{ secrets.RESTORE_POINT_PASSPHRASE }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error title=Promotion::FLY_API_TOKEN is empty in the production environment, so nothing was promoted. Set it as in docs/deploy.md (GitHub)."
            exit 1
          fi
          if [ -z "$RESTORE_POINT_PASSPHRASE" ]; then
            echo "::error title=Promotion::RESTORE_POINT_PASSPHRASE is empty in the production environment, so nothing was promoted: the restore point could not be encrypted. Set it with just restore-point-key (docs/deploy.md, Promotion)."
            exit 1
          fi

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      # Guards, no public IP, image copy, restore point: a pg_dump of production, encrypted (scripts/promote.sh).
      - name: Restore point
        id: point
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RESTORE_POINT_PASSPHRASE: ${{ secrets.RESTORE_POINT_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          RESTORE_POINT_DIR: ${{ runner.temp }}/restore-point
          # No version asked: promote.sh refuses a tag older than what production runs (not a rollback).
          PROMOTE_NEWEST: ${{ inputs.version == '' }}
        run: |
          flyctl auth docker
          scripts/promote.sh prepare "$TAG"

      # The restore point, kept with the run: encrypted (the repository is public, and so are its artifacts),
      # 90 days (the longest GitHub keeps one). A failed upload fails the job: nothing is deployed.
      - name: Keep the restore point
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.point.outputs.point }}
          path: ${{ steps.point.outputs.file }}
          retention-days: 90
          compression-level: 0 # encrypted, and the dump is compressed already
          if-no-files-found: error

      # Deploy, smoke check, digest, GitHub Release (scripts/promote.sh), once the restore point is kept.
      - name: Promote
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TAG: ${{ needs.resolve.outputs.tag }}
          RESTORE_POINT_DIR: ${{ runner.temp }}/restore-point
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$ARTIFACT_ID" ] || { echo "::error title=Promotion::the restore point was not kept as an artifact, so nothing was deployed."; exit 1; }
          RESTORE_POINT_KEPT="encrypted, artifact $ARTIFACT_ID of $RUN_URL" scripts/promote.sh deploy "$TAG"
