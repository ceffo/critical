name: Release

# The staging release of ADR 0024 step 3: once CI is green on a push to main, compute the release version
# from the conventional commits since the last version, build the image of that commit with the real
# catalogue and the version baked in, push it to the private fly registry, deploy it to staging,
# smoke-check it, and only then tag the commit vX.Y.Z. A range that makes no release (docs/test/chore only,
# or the `no-release` label) builds nothing and stays green with a notice. Runbook: docs/deploy.md ("How a
# release flows").
#
# By hand (Actions > Release > Run workflow, on main): with no version, release main's head now, even when
# the rules make no release (a new catalogue); with a version, redeploy that existing version's image to
# staging (nothing built, nothing tagged).
#
# workflow_run, not a job of ci.yml: CI cancels a running main build when a newer commit lands
# (cancel-in-progress), while a release run must finish once started; here a newer commit only replaces a
# queued one (the job's concurrency below). workflow_run always runs this file as it is on main, so a
# pull request cannot change what runs with the secrets.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Empty: release main's head now (build, deploy, tag), even when the rules make no release.
          X.Y.Z: redeploy that existing version's image to staging.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release:
    name: release
    # Green CI only, and only for a push to main of this repository: a red or cancelled CI run, a pull
    # request (even from a fork's branch named main) and a fork never get here. A manual run only from main
    # (the staging environment's branch rule is the enforced half, docs/deploy.md).
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event) &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # The environment scopes FLY_API_TOKEN and RULEBOOKS_DEPLOY_KEY. One job, inline, not a reusable
    # workflow: a called workflow's job does not see its environment's secrets.
    environment: staging
    permissions:
      contents: write     # the version tag, created once staging passed (scripts/version-tag.sh)
      deployments: write  # the staging deployment record
      pull-requests: read # the labels of the merged PRs (no-release)
    # One job from the version to the tag, serialized and never cancelled once started (a newer run only
    # replaces a queued one): two runs computing a version at once would both take the same number. On the
    # job, not the workflow: every CI completion on a branch named main starts a run of this workflow, and a
    # job skipped by its `if` never joins the group, so it cannot replace a pending green release.
    concurrency:
      group: release-staging
      cancel-in-progress: false
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      REDEPLOY: ${{ inputs.version }}
    steps:
      # main's head: the scripts, the action, the history and the tags. The release commit's tree is
      # checked out on its own below, for the build only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # First: the version (or the version to redeploy). No release: a notice, and every later step is skipped.
      - name: Compute the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: |
          if [ -n "$REDEPLOY" ]; then
            sha="$(scripts/release-version.sh resolve "$REDEPLOY")"
            echo "::notice title=Redeploy::v${REDEPLOY#v} ($sha) is deployed to staging again: nothing is built or tagged"
            printf 'release=false\nredeploy=true\nversion=%s\nsha=%s\n' "${REDEPLOY#v}" "$sha" >> "$GITHUB_OUTPUT"
          else
            # shellcheck disable=SC2086 # FORCE is empty or one word
            scripts/release-version.sh next "$COMMIT" $FORCE
            echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"
          fi

      # Missing secrets (before the user provisions them): a notice, and an automatic run stays green (step
      # 10.4). A redeploy needs the deploy token only.
      - name: Check the release secrets
        id: secrets
        if: steps.version.outputs.release == 'true' || steps.version.outputs.redeploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RULEBOOKS_DEPLOY_KEY: ${{ secrets.RULEBOOKS_DEPLOY_KEY }}
        run: |
          if [ -n "$REDEPLOY" ]; then
            scripts/release-secrets.sh FLY_API_TOKEN
          else
            scripts/release-secrets.sh FLY_API_TOKEN RULEBOOKS_DEPLOY_KEY
          fi

      # A manual run asked for a deploy that cannot happen: it fails instead.
      - name: Refuse a manual run without its secrets
        if: github.event_name == 'workflow_dispatch' && steps.secrets.outputs.ready != 'true' && steps.secrets.outcome == 'success'
        run: |
          echo "::error title=Release::a secret is missing in the staging environment (see the notice above): nothing was released"
          exit 1

      - name: Set up flyctl
        if: steps.secrets.outputs.ready == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Check out the release commit
        if: steps.secrets.outputs.ready == 'true' && steps.version.outputs.release == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.COMMIT }}
          path: release-src
          persist-credentials: false

      # One step, so the catalogue exists only while it runs: fetched into the runner's temp dir (outside
      # the checkouts, never an artifact or a cache), built into the image, then deleted. The image goes
      # to the staging app's repository, the one the staging deploy token may push to, tagged with the
      # commit and the version; production gets the same digest by the promotion (docs/deploy.md).
      #
      # A catalogue whose format the app at this commit does not read (a format bump of the rulebooks
      # whose app half is not on main yet, or the reverse) is caught here, before anything is built:
      # an automatic run ends green with a warning and deploys nothing (staging keeps its running
      # version); the release happens by itself on the next main run once both halves are there. A
      # manual run fails instead (someone asked for a deploy that cannot happen).
      - name: Build and push the release image
        id: build
        if: steps.secrets.outputs.ready == 'true' && steps.version.outputs.release == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RULEBOOKS_DEPLOY_KEY: ${{ secrets.RULEBOOKS_DEPLOY_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          dir="$RUNNER_TEMP/catalogue"
          # The changelog (ADR 0039): made here, where the history and the tags are, for the versions up to
          # this one; the release checkout below has the release commit only. Commit titles, no secret.
          CHANGELOG_DIR="$RUNNER_TEMP/changelog"
          export CHANGELOG_DIR
          trap 'rm -rf "$dir" "$CHANGELOG_DIR"' EXIT
          mkdir -p "$CHANGELOG_DIR"
          scripts/changelog.sh gen "$COMMIT" "$VERSION" > "$CHANGELOG_DIR/changelog.json"
          status=0
          rulebooks="$(scripts/release-catalogue.sh "$dir" release-src)" || status=$?
          if [ "$status" = 3 ]; then
            if [ "$EVENT" = workflow_dispatch ]; then
              echo "::error title=Release::the rulebooks catalogue is in a format the app at this commit does not read (see above): nothing was released"
              exit 1
            fi
            echo "::warning title=Release skipped::the rulebooks catalogue is in a format the app at ${COMMIT:0:7} does not read (see the log): nothing is built or deployed, staging keeps its version. The next main run releases once the app and the rulebooks agree."
            echo "unreadable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$status" = 0 ] || exit "$status"
          unset RULEBOOKS_DEPLOY_KEY
          app="$(sed -n 's/^app = "\(.*\)"$/\1/p' deploy/fly.staging.toml)"
          release="$PWD/scripts/release-image.sh"
          cd release-src
          [ "$(git rev-parse HEAD)" = "$COMMIT" ]
          "$release" "$dir" "$rulebooks" "$app"
          echo "::notice title=Release image::registry.fly.io/$app:v$VERSION = registry.fly.io/$app:$COMMIT (rulebooks $rulebooks)"

      # Deploy, smoke-check (health reports the commit and the version), record the deployment.
      - name: Deploy to staging
        id: deploy
        if: steps.secrets.outputs.ready == 'true' && steps.build.outputs.unreadable != 'true'
        uses: ./.github/actions/staging-deploy
        with:
          sha: ${{ steps.version.outputs.sha }}
          version: ${{ steps.version.outputs.version }}
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
          github-token: ${{ github.token }}

      # Only after a passed staging deploy (a failed one stops the job above): the version becomes a tag.
      # Made with the workflow's token, so it starts no workflow (the Promote workflow is run by hand).
      - name: Tag the version
        if: steps.secrets.outputs.ready == 'true' && steps.version.outputs.release == 'true' && steps.build.outputs.unreadable != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.deploy.outputs.digest }}
        run: scripts/version-tag.sh "$VERSION" "$COMMIT" "$DIGEST"
