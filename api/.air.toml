# Live reload for `just dev-api` (run from api/). Rebuilds and restarts on .go changes.
root = "."
tmp_dir = "../.dev/tmp"

[build]
  cmd = "go build -o ../.dev/tmp/critical-api ./cmd/api"
  entrypoint = ["../.dev/tmp/critical-api"]
  include_ext = ["go"]
  exclude_dir = ["mocks"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
