version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    - errorlint
    - bodyclose
    - unconvert
    - misspell
    - forbidigo
  settings:
    govet:
      enable-all: true
      disable:
        # Struct reordering is churn on JSON/payload-shaped structs, for no behavioural gain.
        - fieldalignment
        # Re-declaring err in an inner scope (if err := ...) is idiomatic here; ~45 hits, no real bugs.
        - shadow
    revive:
      rules:
        - name: exported
          severity: warning
    forbidigo:
      # No presentation text from the domain (docs/agent-workflow.md, "Hard rules for
      # implementers"): the API returns structured data and the frontend words it with i18n.
      # Errors are built with fmt.Errorf (or domain.FieldErrorf), which stay allowed.
      analyze-types: true
      forbid:
        - pattern: ^fmt\.(Sprint|Sprintf|Sprintln|Fprint|Fprintf|Fprintln)$
          msg: "no display text built in the domain: return structured fields, the UI words them (errors: fmt.Errorf)"
  exclusions:
    rules:
      # The rule is for the domain's production code: services and entities.
      - path-except: ^internal/domain/
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - forbidigo
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
    - gci
  settings:
    gofumpt:
      extra:
        group-params: true
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/ceffo/critical/api)
