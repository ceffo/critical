version: 2

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    - errorlint
    - bodyclose
    - unconvert
    - misspell
    - forbidigo
  settings:
    forbidigo:
      # No presentation text from the domain (docs/agent-workflow.md, "Hard rules for
      # implementers"): the API returns structured data and the frontend words it with i18n.
      # Errors are built with fmt.Errorf (or domain.FieldErrorf), which stay allowed.
      analyze-types: true
      forbid:
        - pattern: ^fmt\.(Sprint|Sprintf|Sprintln|Fprint|Fprintf|Fprintln)$
          msg: "no display text built in the domain: return structured fields, the UI words them (errors: fmt.Errorf)"
  exclusions:
    rules:
      # The rule is for the domain's production code: services and entities.
      - path-except: ^internal/domain/
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - forbidigo

formatters:
  enable:
    - gofumpt
    - goimports
    - gci

linters-settings:
  govet:
    enable-all: true
  revive:
    rules:
      - name: exported
        severity: warning
  gofumpt:
    extra-rules: true
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/ceffo/critical/api)

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
