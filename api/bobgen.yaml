sqlite:
  dsn: .tmp_schema.db
  queries:
    - internal/adapters/hpdal/queries
    - internal/adapters/characterdal/queries
    - internal/adapters/buffdal/queries
    - internal/adapters/spelldal/queries
    - internal/adapters/actionlogdal/queries
    - internal/adapters/weapondal/queries
    - internal/adapters/itemdal/queries
    - internal/adapters/critdal/queries
    - internal/adapters/attackformdal/queries
    - internal/adapters/xpdal/queries
    - internal/adapters/skilldal/queries

plugins:
  models:
    destination: internal/storage/sqlite/bob/models
    pkgname: models
  factory:
    destination: internal/storage/sqlite/bob/factory
    pkgname: factory
  dbinfo:
    destination: internal/storage/sqlite/bob/dbinfo
    pkgname: dbinfo
  dberrors:
    destination: internal/storage/sqlite/bob/dberrors
    pkgname: dberrors
