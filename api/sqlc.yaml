# sqlc generates the DAL query code of every adapter listed below (ADR 0025 step 5):
# one Go package per adapter, with a Querier interface its adapter depends on.
# Regenerate with `just generate`; the generated files are committed, never edited.
version: "2"
sql:
  - &adapter
    engine: postgresql
    schema: internal/storage/postgres/migrations # read offline: no database server
    queries: internal/adapters/critdal/queries
    gen:
      go: &go
        package: queries
        out: internal/adapters/critdal/queries
        emit_interface: true
        emit_empty_slices: true
        omit_unused_structs: true
  - <<: *adapter
    queries: internal/adapters/authdal/queries
    gen:
      go:
        <<: *go
        out: internal/adapters/authdal/queries
  - <<: *adapter
    queries: internal/adapters/dicedal/queries
    gen:
      go:
        <<: *go
        out: internal/adapters/dicedal/queries
  - <<: *adapter
    queries: internal/adapters/hpdal/queries
    gen:
      go:
        <<: *go
        out: internal/adapters/hpdal/queries
  - <<: *adapter
    queries: internal/adapters/xpdal/queries
    gen:
      go:
        <<: *go
        out: internal/adapters/xpdal/queries
  - <<: *adapter
    queries: internal/adapters/attackformdal/queries
    gen:
      go:
        <<: *go
        out: internal/adapters/attackformdal/queries
  - <<: *adapter
    queries: internal/adapters/characterdal/queries
    gen:
      go:
        <<: *go
        out: internal/adapters/characterdal/queries
  - <<: *adapter
    queries: internal/adapters/itemdal/queries
    gen:
      go:
        <<: *go
        out: internal/adapters/itemdal/queries
  - <<: *adapter
    queries: internal/adapters/textdal/queries
    gen:
      go:
        <<: *go
        out: internal/adapters/textdal/queries
  - <<: *adapter
    queries: internal/adapters/actionlogdal/queries
    gen:
      go:
        <<: *go
        out: internal/adapters/actionlogdal/queries
  - <<: *adapter
    queries: internal/adapters/buffdal/queries
    gen:
      go:
        <<: *go
        out: internal/adapters/buffdal/queries
  - <<: *adapter
    queries: internal/adapters/spelldal/queries
    gen:
      go:
        <<: *go
        out: internal/adapters/spelldal/queries
  - <<: *adapter
    queries: internal/adapters/spellbookdal/queries
    gen:
      go:
        <<: *go
        out: internal/adapters/spellbookdal/queries
  - <<: *adapter
    queries: internal/storage/postgres/queries
    gen:
      go:
        <<: *go
        out: internal/storage/postgres/queries
