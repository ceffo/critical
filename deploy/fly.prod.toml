# Production app (ADR 0024 steps 2, 5, 8). Used as `fly deploy -c deploy/fly.prod.toml --image <ref>`:
# the image is never named here, the release workflow passes it. Public IPs come only once the login gate is live (step 8.2):
# the first deploy uses --no-public-ips, `just fly-go-public` allocates them. Runbook: docs/deploy.md. Checked by `just check-fly`.
app = "critical-hit"
primary_region = "yyz"

# Same values as the image's ENV (Dockerfile) plus CRITICAL_ENV, which only names the environment for
# /api/health (the same image runs in both apps); `just check-fly` fails when they differ. No CRITICAL_DSN:
# the app has no volume, its data lives in the fly PostgreSQL cluster (tournesol-db, shared), and its
# DSN is the fly secret CRITICAL_DSN (ADR 0024 steps 2.3, 2.4 and 5.1; docs/deploy.md).
[env]
  CRITICAL_ADDR = ":8080"
  CRITICAL_SEEDS_DIR = "/app/seeds"
  CRITICAL_CATALOGUE = "/app/catalogue.json"
  CRITICAL_WEB_DIR = "/app/web"
  CRITICAL_ENV = "production"

# Two machines, always running, updated one at a time (ADR 0024 steps 2.2, 5.2): no planned downtime.
# A release's migrations are additive, so the previous release keeps working while its machines are replaced.
[deploy]
  strategy = "rolling"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    grace_period = "20s"
    interval = "30s"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
