# Staging app (ADR 0024 steps 2, 3, 5, 8). Used as `fly deploy -c deploy/fly.staging.toml --image <ref>`:
# the image is never named here, the release workflow passes it. No public IP is allocated (step 8.2):
# the first deploy uses --no-public-ips. Runbook: docs/deploy.md. Checked by `just check-fly`.
app = "critical-staging"
primary_region = "yyz"

# Same values as the image's ENV (Dockerfile), `just check-fly` fails when they differ. No CRITICAL_DSN: the
# app has no volume, its data lives in the fly PostgreSQL cluster critical-db, and its DSN is the fly secret
# CRITICAL_DSN (ADR 0024 steps 2.3, 2.4 and 5.1; docs/deploy.md).
[env]
  CRITICAL_ADDR = ":8080"
  CRITICAL_SEEDS_DIR = "/app/seeds"
  CRITICAL_CATALOGUE = "/app/catalogue.json"
  CRITICAL_WEB_DIR = "/app/web"

# One machine (ADR 0024 steps 2.1, 5.3), replaced in place on deploy; it stops when idle (below). The
# first deploy passes --ha=false so fly creates one machine, not two (docs/deploy.md).
[deploy]
  strategy = "rolling"

[http_service]
  internal_port = 8080
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    grace_period = "20s"
    interval = "30s"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
