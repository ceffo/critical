# Runs the production image locally (ADR 0024 step 1): one container, the API serving the web app.
# Needs the real catalogue in .catalogue/ (`just catalogue`): `docker compose up --build`, then
# http://localhost:8888. The database lives in the `critical-data` volume.
services:
  critical:
    build:
      context: .
      additional_contexts:
        # Private book data (ADR 0021): passed explicitly, never part of the default build context.
        catalogue: ./.catalogue
      args:
        COMMIT: ${COMMIT:-unknown}
    ports:
      - "8888:8080"
    volumes:
      - critical-data:/data
    restart: unless-stopped

volumes:
  critical-data:
