services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8888:8080"
    environment:
      CRITICAL_DSN: /data/critical.db
      # The spell catalogue artifact (ADR 0021), fetched by `just catalogue`; the API refuses to start
      # without it.
      CRITICAL_CATALOGUE: /app/.catalogue/catalogue.json
    volumes:
      - ./seeds:/app/seeds:ro
      - ./.catalogue:/app/.catalogue:ro
      - critical-data:/data
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  critical-data:
