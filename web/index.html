<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Paint in the saved appearance before the app starts (keep in sync with src/lib/settings.ts
      // and src/lib/theme.ts): critical.settings.v1, else the older critical.theme key.
      (function () {
        var mode = null,
          lang = null;
        try {
          var s = JSON.parse(
            localStorage.getItem("critical.settings.v1") || "null",
          );
          if (s && typeof s === "object") {
            mode = s.mode;
            lang = s.lang;
          } else {
            mode = localStorage.getItem("critical.theme");
            lang = localStorage.getItem("critical.language");
          }
        } catch (e) {}
        var light =
          mode === "light" ||
          (mode !== "dark" &&
            !matchMedia("(prefers-color-scheme: dark)").matches);
        if (!light) document.documentElement.classList.add("dark");
        if (lang === "fr" || lang === "en")
          document.documentElement.lang = lang;
      })();
    </script>
    <title>Critical</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
